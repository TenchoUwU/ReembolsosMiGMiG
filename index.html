<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reembolsos pendientes</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--bd:#e2e6ea;--ac:#2563eb;--act:#fff;--ok:#15803d;--okb:#dcfce7;--no:#b45309;--nob:#fef3c7;--bad:#b91c1c;--badb:#fee2e2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1d2127;--tx:#e8ebee;--mu:#9aa5b1;--bd:#2d333b;--ac:#60a5fa;--act:#0b1220;--ok:#4ade80;--okb:#12301d;--no:#fbbf24;--nob:#33280d;--bad:#f87171;--badb:#3a1616;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1d2127;--tx:#e8ebee;--mu:#9aa5b1;--bd:#2d333b;--ac:#60a5fa;--act:#0b1220;--ok:#4ade80;--okb:#12301d;--no:#fbbf24;--nob:#33280d;--bad:#f87171;--badb:#3a1616;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--mu);margin:0 0 14px;font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 16px;border-radius:999px;cursor:pointer;font:inherit}
.tab.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px}
.stat b{display:block;font-size:20px}.stat span{color:var(--mu);font-size:13px}
.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:transparent;color:var(--tx);padding:5px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--tx);color:var(--bg)}
.grp{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:14px;overflow:hidden}
.gh{padding:10px 14px;font-weight:600;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gh small{color:var(--mu);font-weight:400}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600}
.si{background:var(--okb);color:var(--ok)}.nn{background:var(--nob);color:var(--no)}.late{background:var(--badb);color:var(--bad)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:16px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--mu)}
input,select{width:100%;margin-top:3px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button.pri{background:var(--ac);color:var(--act);border:0;border-radius:8px;padding:9px 18px;font:inherit;cursor:pointer;margin-top:12px}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:9px 18px;font:inherit;cursor:pointer;margin-top:12px;margin-left:6px}
button.mini{background:transparent;border:1px solid var(--bd);color:var(--tx);border-radius:6px;padding:3px 8px;cursor:pointer;font:inherit;font-size:13px}
.msg{padding:10px 14px;border-radius:10px;background:var(--nob);color:var(--no);margin-bottom:12px;font-size:14px}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
.empty{padding:30px;text-align:center;color:var(--mu)}
</style>
</head>
<body>
<main>
  <h1>Reembolsos pendientes</h1>
  <p class="sub" id="sub"></p>
  <div id="note"></div>
  <div class="tabs"><button class="tab on" data-t="ver">Ver</button><button class="tab" data-t="reg" id="tabReg" hidden>Registrar</button></div>

  <section id="vVer">
    <div class="stats" id="stats"></div>
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </section>

  <section id="vReg" hidden>
    <div class="card">
      <b id="ftitle">Nuevo reembolso</b>
      <div class="fg" style="margin-top:10px">
        <label>Nº de reembolso<input id="fNum" inputmode="numeric"></label>
        <label>Nombre<input id="fNom" value="Benjamin Guerra"></label>
        <label>Monto ($)<input id="fMon" inputmode="numeric"></label>
        <label>Estado<select id="fEst"><option>Pagado</option><option>Liquidado</option><option>En revisión</option></select></label>
        <label>Fecha de solicitud<input id="fSol" type="date"></label>
        <label>Fecha posible de pago<input id="fPag" type="date"></label>
        <label>¿Llegó?<select id="fLle"><option value="no">No</option><option value="si">Sí</option></select></label>
      </div>
      <div class="err" id="err"></div>
      <button class="pri" id="save">Guardar</button><button class="sec" id="cancel" hidden>Cancelar edición</button>
    </div>
    <div id="regList"></div>
  </section>
</main>

<script>
const $=s=>document.querySelector(s);
const money=n=>'$ '+Number(n||0).toLocaleString('es-CL');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const parse=s=>{if(!s)return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fd=s=>{const d=parse(s);return d?d.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'}):'—'};
const left=s=>{const d=parse(s);return d?Math.round((d-today())/864e5):null};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let db=null,canWrite=false,rows=[],filter='all',tab='ver',editId=null,loaded=false;
const yearEnd=new Date(today().getFullYear(),11,31);
const yearLeft=Math.round((yearEnd-today())/864e5);
$('#sub').textContent='Quedan '+yearLeft+' días del año · hoy es '+today().toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});

function setDateLimits(){
  $('#fPag').max=iso(yearEnd);
  $('#fPag').min=editId?'':iso(today());
}

function daysBadge(r){
  if(r.llego) return '<span class="badge si">Recibido</span>';
  const d=left(r.fechaPago);
  if(d===null) return '<span style="color:var(--mu)">—</span>';
  if(d<0) return '<span class="badge late">Atrasado '+(-d)+' d</span>';
  if(d===0) return '<span class="badge nn">Hoy</span>';
  return d+' día'+(d===1?'':'s');
}

function rowHtml(r,act){
  return '<tr><td>'+esc(r.num)+'</td><td>'+esc(r.nombre)+'</td><td>'+money(r.monto)+'</td><td>'+esc(r.estado)+'</td>'+
  '<td>'+fd(r.fechaSolicitud)+'</td><td>'+fd(r.fechaPago)+'</td><td>'+daysBadge(r)+'</td>'+
  '<td><span class="badge '+(r.llego?'si':'nn')+'">'+(r.llego?'SÍ':'NO')+'</span></td>'+
  (act?'<td><button class="mini" data-a="tog" data-id="'+r.id+'">'+(r.llego?'Marcar NO':'Marcar SÍ')+'</button> <button class="mini" data-a="edit" data-id="'+r.id+'">Editar</button> <button class="mini" data-a="del" data-id="'+r.id+'">Borrar</button></td>':'')+'</tr>';
}

function table(items,act){
  const groups={};
  items.forEach(r=>{(groups[r.fechaPago||'']=groups[r.fechaPago||'']||[]).push(r)});
  const keys=Object.keys(groups).sort((a,b)=>a===''?1:b===''?-1:a<b?-1:1);
  if(!keys.length) return '<div class="empty">No hay reembolsos para mostrar.</div>';
  return keys.map(k=>{
    const g=groups[k].sort((a,b)=>String(a.num).localeCompare(String(b.num)));
    const tot=g.reduce((s,r)=>s+(+r.monto||0),0);
    const d=left(k);
    const title=k?'Llegan a más tardar el '+fd(k):'Sin fecha de pago';
    const extra=k&&d!==null?(d<0?'venció hace '+(-d)+' d':d===0?'es hoy':'faltan '+d+' día'+(d===1?'':'s')):'';
    return '<div class="grp"><div class="gh"><span>'+title+(extra?' <small>· '+extra+'</small>':'')+'</span><small>'+g.length+' reembolso'+(g.length===1?'':'s')+' · '+money(tot)+'</small></div><div class="sc"><table><thead><tr><th>Nº</th><th>Nombre</th><th>Monto</th><th>Estado</th><th>Solicitud</th><th>Pago posible</th><th>Días restantes</th><th>¿Llegó?</th>'+(act?'<th></th>':'')+'</tr></thead><tbody>'+g.map(r=>rowHtml(r,act)).join('')+'</tbody></table></div></div>';
  }).join('');
}

function render(){
  const pend=rows.filter(r=>!r.llego),rec=rows.filter(r=>r.llego);
  const sum=a=>a.reduce((s,r)=>s+(+r.monto||0),0);
  $('#stats').innerHTML='<div class="stat"><b>'+pend.length+'</b><span>Pendientes</span></div><div class="stat"><b>'+money(sum(pend))+'</b><span>Por recibir</span></div><div class="stat"><b>'+rec.length+'</b><span>Recibidos</span></div><div class="stat"><b>'+money(sum(rec))+'</b><span>Ya recibido</span></div>';
  $('#chips').innerHTML=[['all','Todos'],['pend','Pendientes'],['rec','Recibidos']].map(([k,l])=>'<button class="chip'+(filter===k?' on':'')+'" data-f="'+k+'">'+l+'</button>').join('');
  const items=filter==='pend'?pend:filter==='rec'?rec:rows;
  $('#list').innerHTML=loaded?table(items,false):'<div class="empty">Cargando…</div>';
  if(canWrite) $('#regList').innerHTML=loaded?table(rows,true):'';
}

document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.t) return showTab(t.dataset.t);
  if(t.dataset.f){filter=t.dataset.f;return render();}
  if(t.dataset.a&&db&&canWrite){
    const r=rows.find(x=>x.id===t.dataset.id);if(!r)return;
    try{
      if(t.dataset.a==='tog') await db.collection('reembolsos').doc(r.id).update({llego:!r.llego});
      if(t.dataset.a==='del'&&confirm('¿Borrar el reembolso '+r.num+'?')) await db.collection('reembolsos').doc(r.id).delete();
      if(t.dataset.a==='edit') startEdit(r);
    }catch(x){$('#err').textContent='No se pudo guardar ('+(x.code||'error')+').'}
  }
});

function showTab(t){
  tab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('#vVer').hidden=t!=='ver';$('#vReg').hidden=t!=='reg';
}

function resetForm(){
  editId=null;['fNum','fMon','fSol','fPag'].forEach(i=>$('#'+i).value='');
  $('#fNom').value='Benjamin Guerra';$('#fEst').value='Pagado';$('#fLle').value='no';
  $('#ftitle').textContent='Nuevo reembolso';$('#cancel').hidden=true;$('#err').textContent='';setDateLimits();
}
function startEdit(r){
  editId=r.id;setDateLimits();
  $('#fNum').value=r.num||'';$('#fNom').value=r.nombre||'';$('#fMon').value=r.monto||'';
  if(![...$('#fEst').options].some(o=>o.value===r.estado)) $('#fEst').add(new Option(r.estado,r.estado));
  $('#fEst').value=r.estado||'Pagado';$('#fSol').value=r.fechaSolicitud||'';$('#fPag').value=r.fechaPago||'';
  $('#fLle').value=r.llego?'si':'no';
  $('#ftitle').textContent='Editando '+r.num;$('#cancel').hidden=false;window.scrollTo({top:0,behavior:'smooth'});
}
$('#cancel').onclick=resetForm;

$('#save').onclick=async()=>{
  const err=$('#err');err.textContent='';
  const num=$('#fNum').value.trim(),nombre=$('#fNom').value.trim(),monto=parseInt($('#fMon').value.replace(/\D/g,''),10);
  const fp=$('#fPag').value,fs=$('#fSol').value;
  if(!num||!nombre||!monto){err.textContent='Completa número, nombre y monto.';return;}
  if(fp&&parse(fp)>yearEnd){err.textContent='La fecha de pago debe ser dentro de este año.';return;}
  if(!editId&&fp&&parse(fp)<today()){err.textContent='La fecha posible de pago no puede ser anterior a hoy.';return;}
  if(fs&&fp&&parse(fs)>parse(fp)){err.textContent='La solicitud no puede ser posterior al pago.';return;}
  const data={num,nombre,monto,estado:$('#fEst').value,fechaSolicitud:fs,fechaPago:fp,llego:$('#fLle').value==='si'};
  $('#save').disabled=true;
  try{
    if(editId) await db.collection('reembolsos').doc(editId).set(data);
    else await db.collection('reembolsos').add(data);
    resetForm();
  }catch(x){err.textContent='No se pudo guardar ('+(x.code||'error')+').'}
  $('#save').disabled=false;
};

(async()=>{
  setDateLimits();
  render();
  try {
    const respuesta = await fetch('reembolsos.json');
    if (!respuesta.ok) throw new Error('Error al cargar el archivo');
    
    rows = await respuesta.json();
    loaded = true;
    render();
  } catch(e) {
    $('#note').innerHTML='<div class="msg">No se pudo cargar el archivo reembolsos.json. Asegúrate de que esté en la misma carpeta.</div>';
    $('#list').innerHTML='';
  }
})();
</script>
</body>
</html>
