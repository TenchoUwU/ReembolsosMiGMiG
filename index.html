<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado de Reembolsos</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f6f9; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { color: #2c3e50; text-align: center; margin-top: 0; margin-bottom: 25px; font-size: 28px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #eef2f5; }
        th { background-color: #34495e; color: white; font-weight: 600; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; }
        tr:hover { background-color: #f8fafc; }
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; text-align: center; min-width: 80px; }
        .badge-pagado { background-color: #d4edda; color: #155724; }
        .badge-liquidado { background-color: #cce5ff; color: #004085; }
        .badge-revision { background-color: #fff3cd; color: #856404; }
        .loading { text-align: center; padding: 40px; font-size: 18px; color: #7f8c8d; font-weight: 500; }
        .text-center { text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Estado de Reembolsos Pendientes</h1>
        
        <div id="loading" class="loading">Sincronizando información en tiempo real...</div>
        
        <table id="tabla-container" style="display: none;">
            <thead>
                <tr>
                    <th>Nº Reembolso</th>
                    <th>Nombre</th>
                    <th>Monto</th>
                    <th>Estado</th>
                    <th>F. Solicitud</th>
                    <th>F. Pago</th>
                    <th>¿Llegó?</th>
                </tr>
            </thead>
            <tbody id="tabla-reembolsos"></tbody>
        </table>
    </div>

    <script>
        // ⚠️ PEGA AQUÍ TU ENLACE EN FORMATO .CSV QUE COPIASTE AL PUBLICAR EN LA WEB
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTjSV36wTFDqi5neuxZBsm8przGwa7iLcRNDA8pfYQEMwpf4N3GZHGhneFMS5qL0ynHSAycIfFUR8ck/pub?output=csv";

        async function cargarDatosDesdeSheets() {
            try {
                const response = await fetch(GOOGLE_SHEET_CSV_URL);
                const csvText = await response.text();
                
                // Dividir filas considerando saltos de línea correctos
                const filas = csvText.split(/\r?\n/).map(row => {
                    // Expresión regular para separar por comas respetando los textos entre comillas
                    return row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || row.split(",");
                });
                
                const tbody = document.getElementById('tabla-reembolsos');
                tbody.innerHTML = '';

                // Empezamos en la fila 1 para saltarnos los encabezados (id, num, nombre...)
                for (let i = 1; i < filas.length; i++) {
                    const fila = filas[i];
                    if (!fila || fila.length < 2 || fila[0].trim() === "") continue; 
                    
                    // Limpieza del formato monetario de Google Sheets ($41,258 -> 41258)
                    let montoLimpio = fila[3] ? fila[3].replace(/["$$.,]/g, "").trim() : "0";
                    let montoNumerico = parseInt(montoLimpio) || 0;

                    const item = {
                        num: fila[1] ? fila[1].replace(/"/g, "").trim() : "",
                        nombre: fila[2] ? fila[2].replace(/"/g, "").trim() : "",
                        monto: montoNumerico,
                        estado: fila[4] ? fila[4].replace(/"/g, "").trim() : "En revisión",
                        fechaSolicitud: fila[5] ? fila[5].replace(/"/g, "").trim() : "",
                        fechaPago: fila[6] ? fila[6].replace(/"/g, "").trim() : "",
                        llego: fila[7] ? (fila[7].toLowerCase().includes("true") || fila[7].toLowerCase().includes("sí") || fila[7].toLowerCase().includes("si")) : false
                    };

                    const tr = document.createElement('tr');
                    
                    let estadoClass = 'badge-revision';
                    if(item.estado === 'Pagado') estadoClass = 'badge-pagado';
                    if(item.estado === 'Liquidado') estadoClass = 'badge-liquidado';

                    tr.innerHTML = `
                        <td><b>${item.num}</b></td>
                        <td>${item.nombre}</td>
                        <td>$${item.monto.toLocaleString('es-CL')}</td>
                        <td><span class="badge ${estadoClass}">${item.estado}</span></td>
                        <td class="text-center">${item.fechaSolicitud || '-'}</td>
                        <td class="text-center">${item.fechaPago || '-'}</td>
                        <td class="text-center">${item.llego ? 'Sí ✅' : 'No ❌'}</td>
                    `;
                    tbody.appendChild(tr);
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('tabla-container').style.display = 'table';

            } catch (error) {
                console.error("Error al sincronizar con Google Sheets:", error);
                document.getElementById('loading').innerText = "Error de sincronización. Asegúrate de haber publicado la hoja en formato CSV.";
            }
        }

        window.onload = cargarDatosDesdeSheets;
    </script>
</body>
</html>
